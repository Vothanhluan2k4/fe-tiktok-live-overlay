<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="100%" stop-color="#fe2c55"/>
    </linearGradient>
    <linearGradient id="pink-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyan-pink)" stroke-width="8" opacity="0.3" filter="url(#glow)"/>

  <!-- Speech Bubble Overlay -->
  <path d="M 140 140 H 372 A 32 32 0 0 1 404 172 V 300 A 32 32 0 0 1 372 332 H 240 L 170 388 V 332 H 140 A 32 32 0 0 1 108 300 V 172 A 32 32 0 0 1 140 140 Z" 
        fill="rgba(15, 17, 26, 0.75)" stroke="url(#cyan-pink)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Central Soundwave & Microphone -->
  <!-- Left wave -->
  <rect x="170" y="210" width="16" height="60" rx="8" fill="url(#cyan-pink)"/>
  <rect x="200" y="180" width="16" height="120" rx="8" fill="url(#cyan-pink)"/>

  <!-- Center Mic Capsule -->
  <rect x="236" y="160" width="40" height="110" rx="20" fill="url(#cyan-pink)"/>
  <path d="M 220 230 A 36 36 0 0 0 292 230 V 260 H 220 Z" fill="none" stroke="url(#pink-purple)" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="270" x2="256" y2="300" stroke="url(#pink-purple)" stroke-width="10" stroke-linecap="round"/>

  <!-- Right wave -->
  <rect x="296" y="180" width="16" height="120" rx="8" fill="url(#cyan-pink)"/>
  <rect x="326" y="210" width="16" height="60" rx="8" fill="url(#cyan-pink)"/>

  <!-- Live Pulse Dot -->
  <circle cx="370" cy="170" r="14" fill="#fe2c55" filter="url(#glow)"/>
</svg>